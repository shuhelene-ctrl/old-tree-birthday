<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title> Happy Birthday Mia !</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #fce4ec;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow: hidden;
    }

    h1 {
      color: #ad1457;
      font-size: 28px;
      margin-bottom: 10px;
      text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
    }

    .hint {
      color: #880e4f;
      font-size: 14px;
      margin-bottom: 30px;
      animation: pulse 1.5s infinite alternate;
    }

    /* --- Le Hérisson --- */
    .hedgehog-container {
      position: relative;
      cursor: pointer;
      transition: transform 0.3s ease;
    }

    .hedgehog-container:hover {
      transform: scale(1.05);
    }

    .hedgehog {
      position: relative;
      width: 160px;
      height: 110px;
      animation: wiggle 3s ease-in-out infinite;
    }

    /* Piquants */
    .quills {
      position: absolute;
      top: 0;
      left: 10px;
      width: 130px;
      height: 90px;
      background: #6d4c41;
      border-radius: 80px 80px 40px 40px;
      box-shadow: 
        -5px -5px 0 #5d4037, 
        5px -5px 0 #5d4037,
        0 -8px 0 #4e342e;
    }

    /* Corps / Tête */
    .body {
      position: absolute;
      bottom: 5px;
      right: 0;
      width: 100px;
      height: 75px;
      background: #d7ccc8;
      border-radius: 50px 60px 40px 50px;
    }

    /* Museau */
    .snout {
      position: absolute;
      right: -10px;
      bottom: 15px;
      width: 35px;
      height: 30px;
      background: #d7ccc8;
      border-radius: 15px 20px 10px 15px;
    }

    .nose {
      position: absolute;
      right: -2px;
      top: 8px;
      width: 10px;
      height: 10px;
      background: #3e2723;
      border-radius: 50%;
    }

    /* Visage */
    .eye {
      position: absolute;
      right: 25px;
      top: 25px;
      width: 8px;
      height: 8px;
      background: #3e2723;
      border-radius: 50%;
      animation: blink 4s infinite;
    }

    .blush {
      position: absolute;
      right: 18px;
      top: 33px;
      width: 12px;
      height: 6px;
      background: #ff80ab;
      border-radius: 50%;
      opacity: 0.6;
    }

    /* Pattes */
    .paws {
      position: absolute;
      bottom: -5px;
      left: 40px;
      width: 80px;
      display: flex;
      justify-content: space-between;
    }

    .paw {
      width: 16px;
      height: 12px;
      background: #bcaaa4;
      border-radius: 50%;
    }

    /* --- Carte d'anniversaire --- */
    .card-overlay {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(3px);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease;
      z-index: 10;
    }

    .card-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .card {
      width: min(90vw, 400px);
      background: #ffffff;
      border-radius: 15px;
      padding: 25px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.15);
      border: 3px solid #f8bbd0;
      text-align: center;
      transform: translateY(20px);
      transition: transform 0.4s ease;
      position: relative;
    }

    .card-overlay.active .card {
      transform: translateY(0);
    }

    .editable-text {
      outline: none;
      border: 1px dashed #f48fb1;
      border-radius: 8px;
      padding: 15px;
      min-height: 120px;
      background: #fffde7;
      color: #880e4f;
      font-size: 16px;
      line-height: 1.5;
      text-align: left;
      margin-top: 15px;
    }

    .editable-text:focus {
      border-color: #ec407a;
      background: #fff;
    }

    .close-btn {
      margin-top: 20px;
      padding: 8px 20px;
      background: #ec407a;
      color: white;
      border: none;
      border-radius: 20px;
      cursor: pointer;
      font-weight: bold;
      transition: background 0.2s;
    }

    .close-btn:hover {
      background: #d81b60;
    }

    /* --- Animations --- */
    @keyframes wiggle {
      0%, 100% { transform: rotate(0deg); }
      25% { transform: rotate(-2deg); }
      75% { transform: rotate(2deg); }
    }

    @keyframes pulse {
      from { transform: scale(1); opacity: 0.8; }
      to { transform: scale(1.05); opacity: 1; }
    }

    @keyframes blink {
      0%, 90%, 100% { transform: scaleY(1); }
      95% { transform: scaleY(0.1); }
    }
  </style>
</head>
<body>

  <h1>Un petit ami a une surprise pour toi !</h1>
  <div class="hint">🦔 Clique sur le hérisson pour ouvrir la carte 💌</div>

  <div class="hedgehog-container" id="hedgehog">
    <div class="hedgehog">
      <div class="quills"></div>
      <div class="body"></div>
      <div class="snout">
        <div class="nose"></div>
      </div>
      <div class="eye"></div>
      <div class="blush"></div>
      <div class="paws">
        <div class="paw"></div>
        <div class="paw"></div>
      </div>
    </div>
  </div>

  <!-- Modal Carte Éditable -->
  <div class="card-overlay" id="cardOverlay">
    <div class="card">
      <h2 style="color: #ec407a; margin-top: 0;">🎉 Happy Birthday Mia ! 🎂</h2>
      <p style="font-size: 12px; color: #ad1457;">(Clique dans l'encadré ci-dessous pour écrire ton texte)</p>
      
      <div class="editable-text" contenteditable="true">
        Écris ton message personnalisé ici... ❤️
      </div>

      <button class="close-btn" id="closeBtn">Fermer la carte</button>
    </div>
  </div>

  <script>
    const hedgehog = document.getElementById('hedgehog');
    const cardOverlay = document.getElementById('cardOverlay');
    const closeBtn = document.getElementById('closeBtn');

    // Ouvrir la carte au clic sur le hérisson
    hedgehog.addEventListener('click', () => {
      cardOverlay.classList.add('active');
    });

    // Fermer la carte
    closeBtn.addEventListener('click', () => {
      cardOverlay.classList.remove('active');
    });

    // Fermer si on clique en dehors de la carte
    cardOverlay.addEventListener('click', (e) => {
      if (e.target === cardOverlay) {
        cardOverlay.classList.remove('active');
      }
    });
  </script>
</body>
</html>
