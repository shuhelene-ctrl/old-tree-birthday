<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Joyeux Anniversaire !</title>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #fdf5ef;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      overflow: hidden;
    }

    h1 {
      color: #5d3a29;
      font-size: 28px;
      margin-bottom: 6px;
      text-align: center;
      font-weight: 800;
    }

    .hint {
      color: #8c5a43;
      font-size: 15px;
      margin-bottom: 20px;
      font-weight: 600;
      animation: pulse 1.6s infinite alternate;
    }

    /* --- Conteneur et Animation du Hérisson --- */
    .hedgehog-wrapper {
      position: relative;
      width: min(85vw, 300px);
      height: min(85vw, 300px);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.8s cubic-bezier(0.25, 1, 0.5, 1);
      will-change: transform;
    }

    /* Rotation pendant qu'il roule */
    .spin {
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    /* Avancée vers l'écran lors du clic */
    .hedgehog-wrapper.present-card {
      transform: translateY(40px) scale(1.3) rotate(0deg) !important;
    }

    @keyframes pulse {
      0% { transform: scale(1); opacity: 0.85; }
      100% { transform: scale(1.05); opacity: 1; }
    }

    /* --- Carte Pop-up --- */
    .card-overlay {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(43, 23, 14, 0.45);
      backdrop-filter: blur(5px);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease;
      z-index: 100;
    }

    .card-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .card {
      width: min(90vw, 440px);
      max-height: 85vh;
      background: #ffffff;
      border-radius: 20px;
      padding: 28px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.2);
      border: 3px solid #e2b49a;
      text-align: center;
      transform: translateY(30px) scale(0.95);
      transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.27);
      display: flex;
      flex-direction: column;
    }

    .card-overlay.active .card {
      transform: translateY(0) scale(1);
    }

    .card h2 {
      color: #5d3a29;
      margin: 0 0 6px 0;
      font-size: 22px;
    }

    .card-subtitle {
      font-size: 13px;
      color: #9c6b55;
      margin-bottom: 15px;
    }

    .editable-text {
      outline: none;
      border: 2px dashed #e8c4b0;
      border-radius: 12px;
      padding: 16px;
      min-height: 140px;
      max-height: 45vh;
      overflow-y: auto;
      background: #fffbf7;
      color: #4a2e1b;
      font-size: 15px;
      line-height: 1.6;
      text-align: left;
      word-break: break-word;
    }

    .close-btn {
      margin-top: 18px;
      padding: 10px 26px;
      background: #7a4833;
      color: white;
      border: none;
      border-radius: 25px;
      cursor: pointer;
      font-weight: 700;
      font-size: 14px;
      box-shadow: 0 4px 10px rgba(122, 72, 51, 0.3);
      transition: all 0.2s ease;
      align-self: center;
    }

    .close-btn:hover {
      background: #5d3423;
      transform: translateY(-2px);
    }
  </style>
</head>
<body>

  <h1>Un petit message pour toi !</h1>
  <div class="hint">🦔 Clique sur le hérisson ♥</div>

  <div class="hedgehog-wrapper" id="hedgehog">
    <!-- SVG exact de ton hérisson d'origine -->
    <svg viewBox="0 0 300 300" width="100%" height="100%">
      <!-- Piquants (contour brun) -->
      <path d="M 150,20 C 70,20 20,70 20,150 C 20,230 70,280 150,280 C 230,280 280,230 280,150 C 280,70 230,20 150,20 Z" fill="#5c3a21" stroke="#2b160a" stroke-width="8" stroke-linejoin="round"/>
      
      <!-- Petits piquants sur le bord -->
      <path d="M 70,35 L 60,20 M 110,25 L 105,10 M 150,22 L 150,5 M 190,25 L 195,10 M 230,35 L 240,20 M 265,70 L 280,60 M 275,110 L 290,105 M 275,190 L 290,195 M 265,230 L 280,240 M 230,265 L 240,280 M 190,275 L 195,290 M 150,278 L 150,295 M 110,275 L 105,290 M 70,265 L 60,280 M 35,230 L 20,240 M 25,190 L 10,195 M 25,110 L 10,105 M 35,70 L 20,60" stroke="#2b160a" stroke-width="8" stroke-linecap="round"/>

      <!-- Corps principal (Beige) -->
      <path d="M 150,55 C 95,55 60,90 60,150 C 60,210 95,245 150,245 C 205,245 240,210 240,150 C 240,90 205,55 150,55 Z" fill="#fffbf2" stroke="#2b160a" stroke-width="7"/>

      <!-- Oreilles -->
      <path d="M 80,115 C 68,100 85,90 92,108 Z" fill="#fffbf2" stroke="#2b160a" stroke-width="5"/>
      <path d="M 220,115 C 232,100 215,90 208,108 Z" fill="#fffbf2" stroke="#2b160a" stroke-width="5"/>

      <!-- Joues roses -->
      <ellipse cx="105" cy="170" rx="14" ry="8" fill="#fca8a8" opacity="0.7"/>
      <ellipse cx="195" cy="170" rx="14" ry="8" fill="#fca8a8" opacity="0.7"/>

      <!-- Yeux Kawaii -->
      <ellipse cx="125" cy="145" rx="10" ry="13" fill="#2b160a"/>
      <circle cx="122" cy="140" r="4" fill="#ffffff"/>
      <ellipse cx="175" cy="145" rx="10" ry="13" fill="#2b160a"/>
      <circle cx="172" cy="140" r="4" fill="#ffffff"/>

      <!-- Nez et bouche -->
      <ellipse cx="150" cy="158" rx="8" ry="6" fill="#2b160a"/>
      <circle cx="148" cy="156" r="2" fill="#ffffff"/>

      <!-- Pattes supérieures -->
      <path d="M 105,185 C 95,195 110,210 118,198 C 122,190 115,180 105,185 Z" fill="#fffbf2" stroke="#2b160a" stroke-width="5"/>
      <path d="M 195,185 C 205,195 190,210 182,198 C 178,190 185,180 195,185 Z" fill="#fffbf2" stroke="#2b160a" stroke-width="5"/>

      <!-- Pattes inférieures (avec coussinets) -->
      <ellipse cx="115" cy="225" rx="16" ry="12" fill="#fffbf2" stroke="#2b160a" stroke-width="5"/>
      <ellipse cx="115" cy="227" rx="8" ry="6" fill="#fca8a8"/>

      <ellipse cx="185" cy="225" rx="16" ry="12" fill="#fffbf2" stroke="#2b160a" stroke-width="5"/>
      <ellipse cx="185" cy="227" rx="8" ry="6" fill="#fca8a8"/>
    </svg>
  </div>

  <div class="card-overlay" id="cardOverlay">
    <div class="card">
      <h2>🎉 Joyeux Anniversaire ! 🎂</h2>
      <div class="card-subtitle">(Clique dans l'encadré pour personnaliser ton texte)</div>
      
      <div class="editable-text" contenteditable="true">
        Joyeux Anniversaire ! 🎂<br><br>
        Que tous tes souhaits se réalisent en cette magnifique journée ! 🌳✨<br><br>
        Plein de bonheur et de surprises ! ❤️
      </div>

      <button class="close-btn" id="closeBtn">Fermer la carte</button>
    </div>
  </div>

  <script>
    const hedgehog = document.getElementById('hedgehog');
    const cardOverlay = document.getElementById('cardOverlay');
    const closeBtn = document.getElementById('closeBtn');

    let isMoving = true;
    let positionX = 0;

    // Cycle : Roule -> Pause -> Roule...
    function moveCycle() {
      if (!isMoving) return;

      // 1. Début de la roulade
      hedgehog.classList.add('spin');
      positionX += 60;

      // Si le hérisson sort trop de l'écran, réapparition de l'autre côté
      if (positionX > window.innerWidth / 3) {
        positionX = -window.innerWidth / 3;
      }

      hedgehog.style.transform = `translateX(${positionX}px)`;

      // 2. Pause après 0.8s
      setTimeout(() => {
        if (!isMoving) return;
        hedgehog.classList.remove('spin');

        // 3. Redémarrage après 1.2s de pause
        setTimeout(() => {
          if (isMoving) moveCycle();
        }, 1200);

      }, 800);
    }

    // Lancement du cycle au chargement
    moveCycle();

    // Événement au clic
    hedgehog.addEventListener('click', () => {
      if (!isMoving) return;

      isMoving = false; // Stoppe le déplacement en boucle
      hedgehog.classList.remove('spin');

      // Le hérisson s'avance vers l'avant
      hedgehog.classList.add('present-card');

      // Ouverture de la carte d'anniversaire + confetti
      setTimeout(() => {
        cardOverlay.classList.add('active');

        if (typeof confetti === 'function') {
          confetti({
            particleCount: 120,
            spread: 70,
            origin: { y: 0.6 }
          });
        }
      }, 500);
    });

    closeBtn.addEventListener('click', () => {
      cardOverlay.classList.remove('active');
    });

    cardOverlay.addEventListener('click', (e) => {
      if (e.target === cardOverlay) {
        cardOverlay.classList.remove('active');
      }
    });
  </script>
</body>
</html>
