<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title> Happy Birthday Mia !</title>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #fdf5ef;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      overflow: hidden;
      position: relative;
    }

    /* --- Cœurs Animés en Arrière-plan --- */
    .bg-hearts {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      z-index: 0;
      pointer-events: none;
    }

    .heart {
      position: absolute;
      bottom: -10%;
      color: #e8a398;
      user-select: none;
      animation: floatUp linear infinite;
    }

    @keyframes floatUp {
      0% {
        transform: translateY(0) scale(0.8) rotate(0deg);
        opacity: 0;
      }
      10% {
        opacity: 0.6;
      }
      90% {
        opacity: 0.6;
      }
      100% {
        transform: translateY(-115vh) scale(1.2) rotate(360deg);
        opacity: 0;
      }
    }

    h1 {
      color: #5d3a29;
      font-size: 28px;
      margin-bottom: 6px;
      text-align: center;
      font-weight: 800;
      z-index: 1;
    }

    .hint {
      color: #8c5a43;
      font-size: 15px;
      margin-bottom: 20px;
      font-weight: 600;
      animation: pulse 1.6s infinite alternate;
      z-index: 1;
    }

    /* --- Container du Hérisson Vectoriel Animé --- */
    .hedgehog-wrapper {
      position: relative;
      width: min(85vw, 320px);
      height: min(85vw, 336px);
      cursor: pointer;
      transition: transform 0.6s cubic-bezier(0.25, 1, 0.5, 1);
      will-change: transform;
      z-index: 1;
    }

    .hedgehog-wrapper:hover {
      transform: scale(1.06) translateY(-6px);
    }

    /* Animation d'avancée vers l'écran au clic */
    .hedgehog-wrapper.zoom-forward {
      transform: scale(1.45) translateY(20px) !important;
    }

    /* Respiration continue et douce du hérisson */
    .hedgehog-body {
      transform-origin: center bottom;
      animation: gentleBreath 3s ease-in-out infinite alternate;
    }

    /* Clignement des yeux */
    .eyes {
      transform-origin: center 168px;
      animation: blinkEyes 4s infinite;
    }

    /* Animation des oreilles */
    .ear-left {
      transform-origin: 110px 128px;
      animation: earWiggleLeft 4.5s infinite;
    }
    .ear-right {
      transform-origin: 290px 128px;
      animation: earWiggleRight 4.5s infinite 0.2s;
    }

    @keyframes gentleBreath {
      0% { transform: scale(1) translateY(0); }
      100% { transform: scale(1.02, 0.99) translateY(-5px); }
    }

    @keyframes blinkEyes {
      0%, 90%, 100% { transform: scaleY(1); }
      95% { transform: scaleY(0.1); }
    }

    @keyframes earWiggleLeft {
      0%, 88%, 100% { transform: rotate(0deg); }
      93% { transform: rotate(-7deg); }
    }

    @keyframes earWiggleRight {
      0%, 88%, 100% { transform: rotate(0deg); }
      93% { transform: rotate(7deg); }
    }

    @keyframes pulse {
      0% { transform: scale(1); opacity: 0.85; }
      100% { transform: scale(1.05); opacity: 1; }
    }

    /* --- Carte Pop-up --- */
    .card-overlay {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(43, 23, 14, 0.45);
      backdrop-filter: blur(5px);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease;
      z-index: 100;
    }

    .card-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .card {
      width: min(90vw, 440px);
      max-height: 85vh;
      background: #ffffff;
      border-radius: 20px;
      padding: 28px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.2);
      border: 3px solid #e2b49a;
      text-align: center;
      transform: translateY(30px) scale(0.95);
      transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.27);
      display: flex;
      flex-direction: column;
    }

    .card-overlay.active .card {
      transform: translateY(0) scale(1);
    }

    .card h2 {
      color: #5d3a29;
      margin: 0 0 6px 0;
      font-size: 22px;
    }

    .card-subtitle {
      font-size: 13px;
      color: #9c6b55;
      margin-bottom: 15px;
    }

    .editable-text {
      outline: none;
      border: 2px dashed #e8c4b0;
      border-radius: 12px;
      padding: 16px;
      min-height: 140px;
      max-height: 45vh;
      overflow-y: auto;
      background: #fffbf7;
      color: #4a2e1b;
      font-size: 15px;
      line-height: 1.6;
      text-align: left;
      word-break: break-word;
    }

    .close-btn {
      margin-top: 18px;
      padding: 10px 26px;
      background: #7a4833;
      color: white;
      border: none;
      border-radius: 25px;
      cursor: pointer;
      font-weight: 700;
      font-size: 14px;
      box-shadow: 0 4px 10px rgba(122, 72, 51, 0.3);
      transition: all 0.2s ease;
      align-self: center;
    }

    .close-btn:hover {
      background: #5d3423;
      transform: translateY(-2px);
    }
  </style>
</head>
<body>

  <!-- Arrière-plan de cœurs animés -->
  <div class="bg-hearts" id="heartsContainer"></div>

  <h1> Someone has a message for you !</h1>

  <div class="hedgehog-wrapper" id="hedgehog">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 420" width="100%" height="100%">
      <defs>
        <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
          <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#3d2319" flood-opacity="0.2"/>
        </filter>
        <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
          <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#3d2319" flood-opacity="0.15"/>
        </filter>
        <linearGradient id="spikeGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#734a3a"/>
          <stop offset="100%" stop-color="#3d2319"/>
        </linearGradient>
        <linearGradient id="bodyGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#fff8ef"/>
          <stop offset="100%" stop-color="#f2d7c0"/>
        </linearGradient>
      </defs>

      <ellipse cx="200" cy="385" rx="115" ry="18" fill="#e0c2b0" opacity="0.6"/>

      <g class="hedgehog-body" filter="url(#shadow)">
        <!-- Silhouette piquants -->
        <path d="M 200,30 
                 C 225,28 245,18 265,38 C 285,25 305,38 318,58 C 338,52 348,72 358,92
                 C 372,102 368,122 378,142 C 388,162 378,182 383,202 C 388,227 378,247 378,267
                 C 378,287 363,307 358,327 C 348,347 328,362 308,372 C 288,382 268,377 248,385
                 C 228,387 208,382 198,382 C 188,382 168,387 148,385 C 128,377 108,382 88,372
                 C 68,362 48,347 38,327 C 33,307 18,287 18,267 C 18,247 8,227 13,202
                 C 18,182 8,162 18,142 C 28,122 23,102 38,92 C 48,72 58,52 78,58
                 C 88,38 108,25 128,38 C 148,18 168,28 200,30 Z" 
              fill="url(#spikeGrad)" stroke="#2b170e" stroke-width="7" stroke-linejoin="round"/>

        <!-- Piquants individuels -->
        <g fill="#3d2319">
          <path d="M 190,38 L 200,18 L 210,38 Z" />
          <path d="M 230,42 L 245,25 L 255,45 Z" />
          <path d="M 160,42 L 145,25 L 135,45 Z" />
          <path d="M 280,62 L 302,48 L 300,72 Z" />
          <path d="M 120,62 L 98,48 L 100,72 Z" />
          <path d="M 330,98 L 358,88 L 345,112 Z" />
          <path d="M 70,98 L 42,88 L 55,112 Z" />
          <path d="M 350,148 L 378,142 L 360,168 Z" />
          <path d="M 50,148 L 22,142 L 40,168 Z" />
          <path d="M 355,208 L 382,212 L 360,228 Z" />
          <path d="M 45,208 L 18,212 L 40,228 Z" />
          <path d="M 340,268 L 368,282 L 340,292 Z" />
          <path d="M 60,268 L 32,282 L 60,292 Z" />
          <path d="M 310,318 L 332,342 L 300,342 Z" />
          <path d="M 90,318 L 68,342 L 100,342 Z" />
        </g>

        <!-- Visage et Ventre -->
        <path d="M 200,68 
                 C 260,68 310,108 310,178
                 C 310,248 295,342 200,342
                 C 105,342 90,248 90,178
                 C 90,108 140,68 200,68 Z" 
              fill="url(#bodyGrad)" stroke="#2b170e" stroke-width="6.5" stroke-linejoin="round"/>

        <!-- Oreille Gauche -->
        <g class="ear-left">
          <path d="M 115,108 C 88,98 78,133 105,143 Z" fill="#f2d7c0" stroke="#2b170e" stroke-width="5.5"/>
          <path d="M 110,116 C 95,108 90,128 105,136 Z" fill="#e8a398"/>
        </g>

        <!-- Oreille Droite -->
        <g class="ear-right">
          <path d="M 285,108 C 312,98 322,133 295,143 Z" fill="#f2d7c0" stroke="#2b170e" stroke-width="5.5"/>
          <path d="M 290,116 C 305,108 310,128 295,136 Z" fill="#e8a398"/>
        </g>

        <!-- Joues -->
        <ellipse cx="140" cy="192" rx="16" ry="10" fill="#fca898" opacity="0.65"/>
        <ellipse cx="260" cy="192" rx="16" ry="10" fill="#fca898" opacity="0.65"/>

        <!-- Yeux -->
        <g class="eyes">
          <g>
            <ellipse cx="160" cy="168" rx="13" ry="16" fill="#2b170e"/>
            <circle cx="155" cy="161" r="5" fill="#ffffff"/>
            <circle cx="164" cy="172" r="2.5" fill="#ffffff"/>
          </g>
          <g>
            <ellipse cx="240" cy="168" rx="13" ry="16" fill="#2b170e"/>
            <circle cx="235" cy="161" r="5" fill="#ffffff"/>
            <circle cx="244" cy="172" r="2.5" fill="#ffffff"/>
          </g>
        </g>

        <!-- Museau et Nez -->
        <path d="M 180,183 C 180,173 220,173 220,183 C 220,200 180,200 180,183 Z" fill="#f2d7c0" stroke="#2b170e" stroke-width="4"/>
        <path d="M 188,181 C 188,172 212,172 212,181 C 212,191 188,191 188,181 Z" fill="#2b170e"/>
        <ellipse cx="195" cy="178" rx="3" ry="2" fill="#ffffff"/>

        <!-- Sourire -->
        <path d="M 193,193 Q 200,200 207,193" fill="none" stroke="#2b170e" stroke-width="4" stroke-linecap="round"/>

        <!-- La Carte tenue entre les pattes -->
        <g filter="url(#cardShadow)">
          <rect x="125" y="205" width="150" height="95" rx="10" fill="#fffbf7" stroke="#e2b49a" stroke-width="3.5" transform="rotate(-2, 200, 252)"/>
          <text x="200" y="242" font-size="20" text-anchor="middle" fill="#5d3a29" font-weight="bold"> For you !</text>
          <text x="200" y="272" font-size="22" text-anchor="middle">💌</text>
        </g>

        <!-- Pattes Avant (qui recouvrent les bords de la carte) -->
        <g>
          <path d="M 130,220 C 115,220 120,248 142,248 C 155,248 150,220 130,220 Z" fill="#f2d7c0" stroke="#2b170e" stroke-width="4.5"/>
          <path d="M 132,232 Q 138,230 137,243" fill="none" stroke="#2b170e" stroke-width="3" stroke-linecap="round"/>

          <path d="M 270,220 C 285,220 280,248 258,248 C 245,248 250,220 270,220 Z" fill="#f2d7c0" stroke="#2b170e" stroke-width="4.5"/>
          <path d="M 268,232 Q 262,230 263,243" fill="none" stroke="#2b170e" stroke-width="3" stroke-linecap="round"/>
        </g>

        <!-- Pattes Arrière (Coussinets) -->
        <g>
          <g transform="translate(130, 272) rotate(-10)">
            <ellipse cx="25" cy="35" rx="24" ry="32" fill="#f2d7c0" stroke="#2b170e" stroke-width="5"/>
            <ellipse cx="25" cy="42" rx="12" ry="10" fill="#e8a398"/>
            <circle cx="12" cy="18" r="4.5" fill="#e8a398"/>
            <circle cx="23" cy="14" r="5" fill="#e8a398"/>
            <circle cx="35" cy="18" r="4.5" fill="#e8a398"/>
          </g>

          <g transform="translate(220, 272) rotate(10)">
            <ellipse cx="25" cy="35" rx="24" ry="32" fill="#f2d7c0" stroke="#2b170e" stroke-width="5"/>
            <ellipse cx="25" cy="42" rx="12" ry="10" fill="#e8a398"/>
            <circle cx="15" cy="18" r="4.5" fill="#e8a398"/>
            <circle cx="27" cy="14" r="5" fill="#e8a398"/>
            <circle cx="38" cy="18" r="4.5" fill="#e8a398"/>
          </g>
        </g>
      </g>
    </svg>
  </div>

  <div class="card-overlay" id="cardOverlay">
    <div class="card">
      <h2>🎉 Joyeux Anniversaire ! 🎂</h2>
      <div class="card-subtitle">(Clique dans l'encadré pour personnaliser ton texte)</div>
      
      <div class="editable-text" contenteditable="true">
        Joyeux Anniversaire ! 🎂<br><br>
        Que tous tes souhaits se réalisent en cette magnifique journée ! 🌳✨<br><br>
        Plein de bonheur et de surprises ! ❤️
      </div>

      <button class="close-btn" id="closeBtn">Fermer la carte</button>
    </div>
  </div>

  <script>
    // Génération des cœurs animés en arrière-plan
    const heartsContainer = document.getElementById('heartsContainer');
    const heartSymbols = ['❤️', '💖', '💕', '💗'];

    function createHeart() {
      const heart = document.createElement('div');
      heart.classList.add('heart');
      heart.innerText = heartSymbols[Math.floor(Math.random() * heartSymbols.length)];
      
      heart.style.left = Math.random() * 100 + 'vw';
      heart.style.fontSize = (Math.random() * 18 + 14) + 'px';
      heart.style.animationDuration = (Math.random() * 4 + 5) + 's';
      
      heartsContainer.appendChild(heart);

      setTimeout(() => {
        heart.remove();
      }, 9000);
    }

    setInterval(createHeart, 450);

    // Événements du Hérisson et Pop-up
    const hedgehog = document.getElementById('hedgehog');
    const cardOverlay = document.getElementById('cardOverlay');
    const closeBtn = document.getElementById('closeBtn');

    hedgehog.addEventListener('click', () => {
      hedgehog.classList.add('zoom-forward');

      setTimeout(() => {
        cardOverlay.classList.add('active');

        if (typeof confetti === 'function') {
          confetti({
            particleCount: 120,
            spread: 70,
            origin: { y: 0.6 }
          });
        }
      }, 400);
    });

    closeBtn.addEventListener('click', () => {
      cardOverlay.classList.remove('active');
      hedgehog.classList.remove('zoom-forward');
    });

    cardOverlay.addEventListener('click', (e) => {
      if (e.target === cardOverlay) {
        cardOverlay.classList.remove('active');
        hedgehog.classList.remove('zoom-forward');
      }
    });
  </script>
</body>
</html>
