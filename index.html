<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Joyeux Anniversaire !</title>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #fdf5ef;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      overflow: hidden;
    }

    h1 {
      color: #5d3a29;
      font-size: 28px;
      margin-bottom: 6px;
      text-align: center;
      font-weight: 800;
    }

    .hint {
      color: #8c5a43;
      font-size: 15px;
      margin-bottom: 20px;
      font-weight: 600;
      animation: pulse 1.6s infinite alternate;
    }

    /* --- Conteneur et Animation du Hérisson --- */
    .hedgehog-wrapper {
      position: relative;
      width: min(85vw, 320px);
      height: min(85vw, 320px);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.8s cubic-bezier(0.25, 1, 0.5, 1);
      will-change: transform;
    }

    .hedgehog-img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      pointer-events: none;
    }

    /* Rotation pendant qu'il roule */
    .spin {
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    /* Avancée vers l'écran lors du clic */
    .hedgehog-wrapper.present-card {
      transform: translateY(40px) scale(1.3) rotate(0deg) !important;
    }

    @keyframes pulse {
      0% { transform: scale(1); opacity: 0.85; }
      100% { transform: scale(1.05); opacity: 1; }
    }

    /* --- Carte Pop-up --- */
    .card-overlay {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(43, 23, 14, 0.45);
      backdrop-filter: blur(5px);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease;
      z-index: 100;
    }

    .card-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .card {
      width: min(90vw, 440px);
      max-height: 85vh;
      background: #ffffff;
      border-radius: 20px;
      padding: 28px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.2);
      border: 3px solid #e2b49a;
      text-align: center;
      transform: translateY(30px) scale(0.95);
      transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.27);
      display: flex;
      flex-direction: column;
    }

    .card-overlay.active .card {
      transform: translateY(0) scale(1);
    }

    .card h2 {
      color: #5d3a29;
      margin: 0 0 6px 0;
      font-size: 22px;
    }

    .card-subtitle {
      font-size: 13px;
      color: #9c6b55;
      margin-bottom: 15px;
    }

    .editable-text {
      outline: none;
      border: 2px dashed #e8c4b0;
      border-radius: 12px;
      padding: 16px;
      min-height: 140px;
      max-height: 45vh;
      overflow-y: auto;
      background: #fffbf7;
      color: #4a2e1b;
      font-size: 15px;
      line-height: 1.6;
      text-align: left;
      word-break: break-word;
    }

    .close-btn {
      margin-top: 18px;
      padding: 10px 26px;
      background: #7a4833;
      color: white;
      border: none;
      border-radius: 25px;
      cursor: pointer;
      font-weight: 700;
      font-size: 14px;
      box-shadow: 0 4px 10px rgba(122, 72, 51, 0.3);
      transition: all 0.2s ease;
      align-self: center;
    }

    .close-btn:hover {
      background: #5d3423;
      transform: translateY(-2px);
    }
  </style>
</head>
<body>

  <h1>Un petit message pour toi !</h1>
  <div class="hint">🦔 Clique sur le hérisson 💌</div>

  <div class="hedgehog-wrapper" id="hedgehog">
    <!-- Image d'origine du hérisson -->
    <img src="https://i.ibb.co/3YvC5qQ/hedgehog.png" alt="Hérisson" class="hedgehog-img">
  </div>

  <div class="card-overlay" id="cardOverlay">
    <div class="card">
      <h2>🎉 Joyeux Anniversaire ! 🎂</h2>
      <div class="card-subtitle">(Clique dans l'encadré pour personnaliser ton texte)</div>
      
      <div class="editable-text" contenteditable="true">
        Joyeux Anniversaire ! 🎂<br><br>
        Que tous tes souhaits se réalisent en cette magnifique journée ! 🌳✨<br><br>
        Plein de bonheur et de surprises ! ❤️
      </div>

      <button class="close-btn" id="closeBtn">Fermer la carte</button>
    </div>
  </div>

  <script>
    const hedgehog = document.getElementById('hedgehog');
    const cardOverlay = document.getElementById('cardOverlay');
    const closeBtn = document.getElementById('closeBtn');

    let isMoving = true;
    let positionX = 0;

    // Cycle : Roule -> Pause -> Roule...
    function moveCycle() {
      if (!isMoving) return;

      // 1. Début de la roulade
      hedgehog.classList.add('spin');
      positionX += 60;

      // Si le hérisson sort trop de l'écran, réapparition de l'autre côté
      if (positionX > window.innerWidth / 3) {
        positionX = -window.innerWidth / 3;
      }

      hedgehog.style.transform = `translateX(${positionX}px)`;

      // 2. Pause après 0.8s
      setTimeout(() => {
        if (!isMoving) return;
        hedgehog.classList.remove('spin');

        // 3. Redémarrage après 1.2s de pause
        setTimeout(() => {
          if (isMoving) moveCycle();
        }, 1200);

      }, 800);
    }

    // Lancement du cycle au chargement
    moveCycle();

    // Événement au clic
    hedgehog.addEventListener('click', () => {
      if (!isMoving) return;

      isMoving = false; // Stoppe le déplacement en boucle
      hedgehog.classList.remove('spin');

      // Le hérisson s'avance vers l'avant
      hedgehog.classList.add('present-card');

      // Ouverture de la carte d'anniversaire + confetti
      setTimeout(() => {
        cardOverlay.classList.add('active');

        if (typeof confetti === 'function') {
          confetti({
            particleCount: 120,
            spread: 70,
            origin: { y: 0.6 }
          });
        }
      }, 500);
    });

    closeBtn.addEventListener('click', () => {
      cardOverlay.classList.remove('active');
    });

    cardOverlay.addEventListener('click', (e) => {
      if (e.target === cardOverlay) {
        cardOverlay.classList.remove('active');
      }
    });
  </script>
</body>
</html>
